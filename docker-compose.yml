# CasePack — self-host Docker Compose stack (design-partner preview).
# Install steps: https://docs.casepack.app/self-host-runbook/
#
# Plain HTTP: run it only on a network you trust until TLS is supported.
#
# Default URLs:
#   API:      http://localhost:8080
#   SPA:      http://localhost:3000
#   Sign-in:  http://localhost:8081 (keycloak-edge: only the casepack realm)
#   Keycloak admin console: http://localhost:8082/admin/ (this machine only)
#   SeaweedFS: http://localhost:8333 (S3 gateway)
#   PostgreSQL, Gotenberg: internal only (not published to the host)

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: ghcr.io/sammyeby/postgresql:17.12-alpine
    restart: unless-stopped
    # Not published: only the API and Keycloak use it, over the Compose network.
    # For psql or pg_dump, use `docker compose exec postgres ...`.
    environment:
      POSTGRES_DB: ${DB_NAME:-casepack}
      POSTGRES_USER: ${DB_USER:-casepack}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      KC_DB_NAME: ${KC_DB_NAME:-keycloak}
      KC_DB_USER: ${KC_DB_USER:-keycloak}
      KC_DB_PASS: ${KC_DB_PASS:?Set KC_DB_PASS in .env}
    volumes:
      # The image keeps its cluster at PGDATA=/var/lib/postgresql/pgdata.
      - pgdata:/var/lib/postgresql/pgdata
      - ./keycloak/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-casepack}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Keycloak ────────────────────────────────────────────────────
  keycloak-theme:
    image: ghcr.io/sammyeby/keycloak-themes:0.5.0
    command: ["sh", "-c", "rm -rf /target/casepack && cp -r /themes/casepack /target/"]
    restart: "no"
    volumes:
      - keycloak-themes:/target
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: ghcr.io/sammyeby/keycloak:26.8.2-optimized
    command: start --optimized --import-realm --http-port=8080
    restart: unless-stopped
    ports:
      # The admin console and the master realm: this machine only. From elsewhere,
      # use an SSH tunnel. Browsers sign in through keycloak-edge on KEYCLOAK_PORT.
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8082}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASS:?Set KC_DB_PASS in .env}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_ADMIN_URL:-http://localhost:8082}
      # The realm import sets the casepack-user-manager client's secret from this (first start only).
      CASEPACK_KEYCLOAK_SA_CLIENT_SECRET: ${CASEPACK_KEYCLOAK_SA_CLIENT_SECRET:?Set CASEPACK_KEYCLOAK_SA_CLIENT_SECRET in .env (generate it; see .env.example)}
      KC_HTTP_ENABLED: "true"
      # keycloak-edge sets X-Forwarded-For to the address it sees, replacing any the client sent.
      KC_PROXY_HEADERS: "xforwarded"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASS:?Set KC_ADMIN_PASS in .env}
      KC_SMTP_HOST: "${KC_SMTP_HOST:-}"
      KC_SMTP_PORT: "${KC_SMTP_PORT:-587}"
      # Keycloak rejects a realm whose sender is empty, so this placeholder lets it
      # start without SMTP. With KC_SMTP_HOST empty, Keycloak sends no email.
      KC_SMTP_FROM: "${KC_SMTP_FROM:-noreply@casepack.localhost}"
      KC_SMTP_FROM_DISPLAY_NAME: "${KC_SMTP_FROM_DISPLAY_NAME:-CasePack}"
      KC_SMTP_AUTH: "${KC_SMTP_AUTH:-true}"
      KC_SMTP_USER: "${KC_SMTP_USER:-}"
      KC_SMTP_PASSWORD: "${KC_SMTP_PASSWORD:-}"
      KC_SMTP_STARTTLS: "${KC_SMTP_STARTTLS:-true}"
      KC_SMTP_SSL: "${KC_SMTP_SSL:-false}"
    volumes:
      - ./keycloak/casepack-realm.json:/opt/keycloak/data/import/casepack-realm.json:ro
      - keycloak-themes:/opt/keycloak/themes:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-theme:
        condition: service_completed_successfully

  # Public sign-in entry point. Passes only the casepack realm and the theme resources
  # to Keycloak; the admin console and the master realm stay on the loopback admin port.
  keycloak-edge:
    # The official image, run as its nginx user (uid 101). nginxinc/nginx-unprivileged
    # stopped publishing at 1.30.6, which has critical CVEs fixed in 1.30.7.
    image: docker.io/library/nginx:1.30.8-alpine
    user: "101:101"
    restart: unless-stopped
    read_only: true
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ./keycloak/edge-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /tmp
      # Writable as uid 101: the rendered template, the pid file and nginx's temp files.
      - /etc/nginx/conf.d:mode=1777
      - /run:mode=1777
      - /var/cache/nginx:mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      keycloak:
        condition: service_started
        restart: true

  # The optimized Keycloak image is distroless, so it has no shell/curl for
  # an in-container healthcheck. Use a tiny waiter to gate API bootstrap.
  keycloak-ready:
    image: docker.io/curlimages/curl:8.23.0
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - until curl -fsS http://keycloak:8080/realms/casepack/.well-known/openid-configuration >/dev/null; do echo 'Waiting for Keycloak...'; sleep 2; done
    command: []
    depends_on:
      keycloak:
        condition: service_started

  # ── SeaweedFS (S3-compatible storage) ────────────────────────────
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    command: "server -s3 -s3.port=8333 -dir=/data -volume.max=0"
    restart: unless-stopped
    ports:
      - "${S3_PORT:-8333}:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env (generate it; see .env.example)}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env (generate it; see .env.example)}
    volumes:
      - seaweeddata:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://$$(hostname -i):9333/cluster/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Gotenberg (internal PDF renderer) ─────────────────────────
  gotenberg:
    image: gotenberg/gotenberg:8-chromium
    restart: unless-stopped
    environment:
      API_TIMEOUT: 60s
      API_BODY_LIMIT: 50MB
      API_DISABLE_DOWNLOAD_FROM: "true"
      API_ENABLE_DEBUG_ROUTE: "false"
      CHROMIUM_MAX_CONCURRENCY: "2"
      CHROMIUM_MAX_QUEUE_SIZE: "20"
      CHROMIUM_CLEAR_CACHE: "true"
      CHROMIUM_CLEAR_COOKIES: "true"
      WEBHOOK_DISABLE: "true"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── CasePack API ───────────────────────────────────────────────
  api:
    image: ghcr.io/sammyeby/casepack-api:${CASEPACK_API_VERSION:-0.35.1}
    restart: unless-stopped
    read_only: true
    ports:
      - "${API_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "casepack-s3.localhost:host-gateway"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-casepack}
      DB_USER: ${DB_USER:-casepack}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8081/realms/casepack}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8080/realms/casepack/protocol/openid-connect/certs}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env (generate it; see .env.example)}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env (generate it; see .env.example)}
      S3_BUCKET: ${S3_BUCKET:-casepack}
      S3_PATH_STYLE: "true"
      S3_AUTO_CREATE_BUCKET: "true"
      CASEPACK_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      # Clients connect directly, so X-Forwarded-For is client-supplied: don't trust it.
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      CASEPACK_CONNECTED_LICENSING_ENABLED: "true"
      CASEPACK_LICENSING_BASE_URL: ${LICENSING_API_URL:-https://licensing.samuelumeh.com}
      CASEPACK_LICENSE_STATE_DIR: /var/lib/casepack/licensing
      CASEPACK_LICENSE_KEY_SOURCE: env
      CASEPACK_LICENSE_PUBLIC_KEY: ${CASEPACK_LICENSE_PUBLIC_KEY:?Set CASEPACK_LICENSE_PUBLIC_KEY in .env (copy it from .env.example)}
      CASEPACK_LICENSE_REFRESH_INTERVAL: PT24H
      CASEPACK_LICENSE_REQUEST_TIMEOUT: PT15S
      CASEPACK_DEPLOYMENT_PROFILE: compose-podman-single-api
      CASEPACK_VERSION: ${CASEPACK_API_VERSION:-0.35.1}
      CASEPACK_DEPLOYMENT_MODE: ${CASEPACK_DEPLOYMENT_MODE:-self_host}
      CASEPACK_SELF_HOST_BOOTSTRAP_ENABLED: ${CASEPACK_SELF_HOST_BOOTSTRAP_ENABLED:-true}
      CASEPACK_SELF_HOST_BOOTSTRAP_TENANT_NAME: ${CASEPACK_SELF_HOST_BOOTSTRAP_TENANT_NAME:-CasePack Workspace}
      CASEPACK_SELF_HOST_BOOTSTRAP_ADMIN_EMAIL: ${CASEPACK_SELF_HOST_BOOTSTRAP_ADMIN_EMAIL:?Set the first admin email in .env}
      CASEPACK_SELF_HOST_BOOTSTRAP_ADMIN_INITIAL_PASSWORD: ${CASEPACK_SELF_HOST_BOOTSTRAP_ADMIN_INITIAL_PASSWORD:?Set the temporary first admin password in .env}
      CASEPACK_KEYCLOAK_BASE_URL: ${CASEPACK_KEYCLOAK_BASE_URL:-http://keycloak:8080}
      CASEPACK_KEYCLOAK_REALM: ${CASEPACK_KEYCLOAK_REALM:-casepack}
      CASEPACK_KEYCLOAK_SPA_CLIENT_ID: ${CASEPACK_KEYCLOAK_SPA_CLIENT_ID:-casepack-spa}
      CASEPACK_KEYCLOAK_SPA_REDIRECT_URI: ${CASEPACK_KEYCLOAK_SPA_REDIRECT_URI:-http://localhost:3000/auth/callback}
      CASEPACK_KEYCLOAK_SA_CLIENT_ID: ${CASEPACK_KEYCLOAK_SA_CLIENT_ID:-casepack-user-manager}
      CASEPACK_KEYCLOAK_SA_CLIENT_SECRET: ${CASEPACK_KEYCLOAK_SA_CLIENT_SECRET:?Set CASEPACK_KEYCLOAK_SA_CLIENT_SECRET in .env (generate it; see .env.example)}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      CASEPACK_RATE_LIMIT_GLOBAL: ${CASEPACK_RATE_LIMIT_GLOBAL:-1200}
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx512m}"
    volumes:
      - licensing-state:/var/lib/casepack/licensing
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-ready:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      gotenberg:
        condition: service_healthy

  # ── CasePack SPA ────────────────────────────────────────────────
  spa:
    image: ghcr.io/sammyeby/casepack-spa:${CASEPACK_SPA_VERSION:-0.35.0}
    restart: unless-stopped
    ports:
      - "${SPA_PORT:-3000}:8080"
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    security_opt:
      - no-new-privileges:true
    environment:
      CASEPACK_API_BASE_URL: ${API_URL:-http://localhost:8080}
      CASEPACK_OIDC_AUTHORITY: ${OIDC_AUTHORITY:-http://localhost:8081/realms/casepack}
      CASEPACK_OIDC_CLIENT_ID: casepack-spa
      CASEPACK_DEPLOYMENT_MODE: SELF_HOST
      CASEPACK_LICENSING_PORTAL_URL: ${LICENSING_PORTAL_URL:-https://licensing.samuelumeh.com/portal}
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  seaweeddata:
  keycloak-themes:
  licensing-state:
