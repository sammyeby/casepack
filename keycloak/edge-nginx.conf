# keycloak-edge main configuration, for the official nginx image run as its nginx user
# (uid 101) on a read-only root filesystem.
#
# Everything nginx writes goes to the /tmp tmpfs: the pid file, temp files, and the server
# block the entrypoint renders from edge-nginx.conf.template (NGINX_ENVSUBST_OUTPUT_DIR=/tmp).
# Only that server block is included, not the image's stock conf.d/default.conf.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    include /tmp/default.conf;
}
